defaults:
  - _self_
  - data: ogb

output_model_name: lewm_cube_full
subdir: cube_full

num_workers: 6
train_split: 0.9
seed: 3072
max_clips: null  # null = use all ~2.0M cube clips
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 10 #100
  devices: 1
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: your_entity
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

# motion 分支：仅训练期使用 raw optical flow 作为额外监督，推理路径完全不受影响。
# flow h5 必须提供 `target_index = source_index + flow_target_offset` 的同跨度光流。
motion:
  enabled: True
  flow_path: ${oc.env:STABLEWM_HOME}/cube_single_expert_flow_uv.h5
  flow_key: pixels
  flow_output_key: flow_pixels
  source_index_key: source_index
  target_index_key: target_index
  flow_target_offset: null    # null 表示使用 data.dataset.frameskip
  input_channels: 2
  target_mode: source_frameskip
  detach_target: False
  stats:
    max_samples: 8192
    mean: null
    std: null

loss:
  state:
    weight: 1.0
  motion:
    weight: 0.5
  state_sigreg:
    weight: 0.08
  motion_sigreg:
    weight: 0.2
  sigreg:
    kwargs:
      knots: 17
      num_proj: 1024
